<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" id="correction-flow">
  <defs>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D"/>
      <stop offset="100%" style="stop-color:#1E1E1E"/>
    </linearGradient>
    <linearGradient id="pythonNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3776AB"/>
      <stop offset="100%" style="stop-color:#2D5A7B"/>
    </linearGradient>
    <linearGradient id="pyodideNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0DB4F"/>
      <stop offset="100%" style="stop-color:#D4B800"/>
    </linearGradient>
    <linearGradient id="geminiNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00C853"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#121212"/>

  <!-- Title -->
  <text x="960" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">SYSTÈME DE CORRECTION AUTOMATIQUE</text>
  <text x="960" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#A9B7C6">Boucle de validation itérative Pyodide + Gemini AI</text>

  <!-- Circular Flow Diagram -->
  <g transform="translate(960, 580)">
    <!-- Center circle decoration -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10,10"/>

    <!-- Flow arrows (circular) -->
    <path d="M0,-200 A200,200 0 0,1 173,100" fill="none" stroke="#00C853" stroke-width="4" marker-end="url(#arrowhead)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M173,100 A200,200 0 0,1 0,200" fill="none" stroke="#00C853" stroke-width="4" marker-end="url(#arrowhead)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M0,200 A200,200 0 0,1 -173,100" fill="none" stroke="#00C853" stroke-width="4" marker-end="url(#arrowhead)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M-173,100 A200,200 0 0,1 0,-200" fill="none" stroke="#00C853" stroke-width="4" marker-end="url(#arrowhead)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </path>

    <!-- Node 1: Python Code (Top) -->
    <g transform="translate(0, -320)" filter="url(#glow)">
      <rect x="-100" y="-60" width="200" height="120" rx="15" fill="url(#pythonNode)" stroke="#4A90D9" stroke-width="2"/>
      <text x="0" y="-25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">PYTHON CODE</text>
      <rect x="-60" y="0" width="120" height="30" rx="5" fill="#1E1E1E"/>
      <text x="0" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#FFD43B">def main():</text>
      <!-- Status indicator -->
      <circle cx="80" cy="-45" r="8" fill="#FF4444">
        <animate attributeName="fill" values="#FF4444;#00C853;#FF4444" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Node 2: Pyodide Validation (Right) -->
    <g transform="translate(320, 50)" filter="url(#glow)">
      <rect x="-110" y="-70" width="220" height="140" rx="15" fill="url(#pyodideNode)" stroke="#F0DB4F" stroke-width="2"/>
      <text x="0" y="-35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1E1E1E" font-weight="bold">PYODIDE VALIDATION</text>
      <text x="0" y="-10" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#333">py_compile()</text>
      <rect x="-70" y="10" width="140" height="40" rx="8" fill="#1E1E1E"/>
      <text x="0" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#FF6B6B">SyntaxError: line 42</text>
    </g>

    <!-- Node 3: Error Detected (Bottom) -->
    <g transform="translate(0, 320)" filter="url(#glow)">
      <polygon points="0,-50 -90,30 90,30" fill="url(#nodeGradient)" stroke="#FF4444" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FF4444" font-weight="bold">ERREUR</text>
      <text x="0" y="25" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#FF6B6B">detected!</text>
    </g>

    <!-- Node 4: Gemini AI (Left) -->
    <g transform="translate(-320, 50)" filter="url(#glow)">
      <rect x="-110" y="-70" width="220" height="140" rx="15" fill="url(#geminiNode)" stroke="#A78BFA" stroke-width="2"/>
      <text x="0" y="-35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">GEMINI AI</text>
      <text x="0" y="-10" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#E9D5FF">fix_syntax(code)</text>
      <rect x="-70" y="10" width="140" height="40" rx="8" fill="#1E1E1E"/>
      <text x="0" y="35" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#C4B5FD"># FIXED</text>
      <!-- Sparkle effect -->
      <g fill="#FFD43B">
        <circle cx="-80" cy="-50" r="3">
          <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="80" cy="-40" r="2">
          <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Legend / Stats at bottom -->
  <g transform="translate(960, 920)">
    <!-- Loop counter -->
    <rect x="-200" y="0" width="400" height="80" rx="10" fill="#1E1E1E" stroke="#333" stroke-width="2"/>
    <text x="0" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#A9B7C6">Boucle de correction</text>
    <text x="0" y="60" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#00C853">
      <tspan fill="#FFFFFF">Attempts: </tspan>
      <tspan fill="#00C853">3/10</tspan>
    </text>
  </g>

  <!-- Processing indicator -->
  <g transform="translate(960, 200)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#A9B7C6">Correction automatique jusqu'à</text>
    <text x="0" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="bold" fill="#00C853">syntaxe valide</text>
  </g>

  <!-- Success metrics -->
  <g transform="translate(150, 950)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#1E1E1E" stroke="#00C853" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A9B7C6">Correction Rate</text>
    <text x="90" y="70" text-anchor="middle" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#00C853">94%</text>
  </g>
  <g transform="translate(370, 950)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#1E1E1E" stroke="#3776AB" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A9B7C6">Avg Time</text>
    <text x="90" y="70" text-anchor="middle" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#3776AB">1.2s</text>
  </g>
  <g transform="translate(1370, 950)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#1E1E1E" stroke="#FFD43B" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A9B7C6">Errors Fixed</text>
    <text x="90" y="70" text-anchor="middle" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#FFD43B">2.4K</text>
  </g>
  <g transform="translate(1590, 950)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#1E1E1E" stroke="#FF4444" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A9B7C6">Success Rate</text>
    <text x="90" y="70" text-anchor="middle" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#00C853">100%</text>
  </g>
</svg>