<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" id="logo-codeswitch">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pythonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776AB"/>
      <stop offset="100%" style="stop-color:#FFD43B"/>
    </linearGradient>
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#33FF00"/>
      <stop offset="100%" style="stop-color:#00C853"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#1E1E1E"/>

  <!-- Central Logo Container -->
  <g transform="translate(960, 540)">
    <!-- Background Circle -->
    <circle cx="0" cy="0" r="350" fill="none" stroke="#3776AB" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="#3776AB" stroke-width="1" opacity="0.2"/>

    <!-- Icon: Transformation Arrow -->
    <g transform="translate(-280, 0)" filter="url(#glow)">
      <!-- Left arrow part (COBOL) -->
      <path d="M-60 -40 L0 -40 L0 -80 L80 0 L0 80 L0 40 L-60 40 Z" fill="#33FF00"/>
      <!-- Right arrow part (Python) -->
      <path d="M60 -40 L-10 -40 L-10 -80 L-80 0 L-10 80 L-10 40 L60 40 Z" fill="url(#pythonGradient)"/>
    </g>

    <!-- CODE Text -->
    <text x="0" y="180" text-anchor="middle" font-family="Courier New, monospace" font-size="120" font-weight="bold" fill="#33FF00" filter="url(#glow)">CODE</text>

    <!-- SWITCH Text -->
    <text x="0" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="100" font-weight="bold" fill="url(#pythonGradient)">SWITCH</text>

    <!-- Tagline -->
    <text x="0" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" fill="#A9B7C6" letter-spacing="8">COBOL TO PYTHON, AUTOMATICALLY</text>

    <!-- Decorative elements -->
    <g opacity="0.5">
      <circle cx="-400" cy="-200" r="4" fill="#33FF00"/>
      <circle cx="400" cy="-150" r="4" fill="#FFD43B"/>
      <circle cx="-350" cy="200" r="3" fill="#3776AB"/>
      <circle cx="380" cy="250" r="3" fill="#00C853"/>
    </g>
  </g>

  <!-- Corner decorations -->
  <path d="M0 0 L150 0 L0 150 Z" fill="#33FF00" opacity="0.1"/>
  <path d="M1920 0 L1770 0 L1920 150 Z" fill="#3776AB" opacity="0.1"/>
  <path d="M0 1080 L150 1080 L0 930 Z" fill="#3776AB" opacity="0.1"/>
  <path d="M1920 1080 L1770 1080 L1920 930 Z" fill="#33FF00" opacity="0.1"/>
</svg>