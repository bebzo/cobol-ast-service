<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" id="aging-stats">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="100%" style="stop-color:#CC0000"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3776AB"/>
      <stop offset="100%" style="stop-color:#6BB3D9"/>
    </linearGradient>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#1E1E1E"/>

  <!-- Title -->
  <text x="960" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">LE DÉFI DE LA MAINTENANCE LEGACY</text>
  <text x="960" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#A9B7C6">L'écart se creuse entre l'offre et la demande de compétences COBOL</text>

  <!-- Main Chart Area -->
  <g transform="translate(150, 220)">
    <!-- Grid lines -->
    <g stroke="#333" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="500"/>
      <line x1="0" y1="500" x2="1620" y2="500"/>
      <line x1="0" y1="400" x2="1620" y2="400"/>
      <line x1="0" y1="300" x2="1620" y2="300"/>
      <line x1="0" y1="200" x2="1620" y2="200"/>
      <line x1="0" y1="100" x2="1620" y2="100"/>
    </g>

    <!-- Y-axis labels -->
    <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#A9B7C6">
      <text x="-30" y="505" text-anchor="end">0%</text>
      <text x="-30" y="405" text-anchor="end">25%</text>
      <text x="-30" y="305" text-anchor="end">50%</text>
      <text x="-30" y="205" text-anchor="end">75%</text>
      <text x="-30" y="105" text-anchor="end">100%</text>
    </g>

    <!-- X-axis labels (Years) -->
    <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#A9B7C6" text-anchor="middle">
      <text x="0" y="535">1980</text>
      <text x="270" y="535">1990</text>
      <text x="540" y="535">2000</text>
      <text x="810" y="535">2010</text>
      <text x="1080" y="535">2020</text>
      <text x="1350" y="535">2030</text>
      <text x="1620" y="535">2040</text>
    </g>

    <!-- COBOL Developers Curve (Declining) -->
    <path d="M0,150 Q270,160 540,250 T810,380 T1080,450 T1350,480 T1620,495"
          fill="none" stroke="url(#redGradient)" stroke-width="6" filter="url(#glowRed)"/>

    <!-- Maintenance Demand Curve (Increasing) -->
    <path d="M0,480 Q270,450 540,380 T810,250 T1080,180 T1350,120 T1620,80"
          fill="none" stroke="url(#blueGradient)" stroke-width="6" filter="url(#glowBlue)"/>

    <!-- Data points - COBOL -->
    <g fill="#FF4444">
      <circle cx="0" cy="150" r="8"><title>1980: 100%</title></circle>
      <circle cx="540" cy="250" r="8"><title>2000: 65%</title></circle>
      <circle cx="1080" cy="450" r="8"><title>2020: 15%</title></circle>
      <circle cx="1620" cy="495" r="8"><title>2040: ~1%</title></circle>
    </g>

    <!-- Data points - Demand -->
    <g fill="#3776AB">
      <circle cx="0" cy="480" r="8"><title>1980: 10%</title></circle>
      <circle cx="540" cy="380" r="8"><title>2000: 35%</title></circle>
      <circle cx="1080" cy="180" r="8"><title>2020: 75%</title></circle>
      <circle cx="1620" cy="80" r="8"><title>2040: 95%</title></circle>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(150, 800)">
    <!-- COBOL Developers -->
    <rect x="0" y="0" width="30" height="30" rx="5" fill="url(#redGradient)"/>
    <text x="50" y="22" font-family="Inter, Arial, sans-serif" font-size="24" fill="#FF4444">Développeurs COBOL disponibles</text>
    <text x="50" y="50" font-family="Inter, Arial, sans-serif" font-size="18" fill="#A9B7C6">-98% depuis 1980</text>

    <!-- Maintenance Demand -->
    <rect x="600" y="0" width="30" height="30" rx="5" fill="url(#blueGradient)"/>
    <text x="650" y="22" font-family="Inter, Arial, sans-serif" font-size="24" fill="#3776AB">Demande de maintenance</text>
    <text x="650" y="50" font-family="Inter, Arial, sans-serif" font-size="18" fill="#A9B7C6">+850% depuis 1980</text>
  </g>

  <!-- Key Stats Cards -->
  <g transform="translate(150, 900)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="350" height="120" rx="10" fill="#2A2A2A" stroke="#333" stroke-width="2"/>
    <text x="30" y="40" font-family="Inter, Arial, sans-serif" font-size="16" fill="#A9B7C6">Âge moyen des experts</text>
    <text x="30" y="85" font-family="Courier New, monospace" font-size="42" font-weight="bold" fill="#FF4444">58 ans</text>

    <!-- Card 2 -->
    <rect x="450" y="0" width="350" height="120" rx="10" fill="#2A2A2A" stroke="#333" stroke-width="2"/>
    <text x="480" y="40" font-family="Inter, Arial, sans-serif" font-size="16" fill="#A9B7C6">Retraites prévues 2025-2030</text>
    <text x="480" y="85" font-family="Courier New, monospace" font-size="42" font-weight="bold" fill="#FF4444">67%</text>

    <!-- Card 3 -->
    <rect x="900" y="0" width="350" height="120" rx="10" fill="#2A2A2A" stroke="#333" stroke-width="2"/>
    <text x="930" y="40" font-family="Inter, Arial, sans-serif" font-size="16" fill="#A9B7C6">Coût de maintenance annuel</text>
    <text x="930" y="85" font-family="Courier New, monospace" font-size="42" font-weight="bold" fill="#FFD43B">2.5M€</text>

    <!-- Card 4 -->
    <rect x="1350" y="0" width="350" height="120" rx="10" fill="#2A2A2A" stroke="#00C853" stroke-width="2"/>
    <text x="1380" y="40" font-family="Inter, Arial, sans-serif" font-size="16" fill="#A9B7C6">Solution CodeSwitch</text>
    <text x="1380" y="85" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#00C853">MIGRATION AUTO</text>
  </g>

  <!-- Warning indicator -->
  <g transform="translate(1650, 650)" filter="url(#glowRed)">
    <polygon points="0,-60 -50,40 50,40" fill="#FF4444" opacity="0.8"/>
    <text x="0" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="bold" fill="#000">!</text>
  </g>
</svg>