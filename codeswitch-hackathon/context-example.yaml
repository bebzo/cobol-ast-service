# ============================================================
# COBOL CONTEXT CONFIGURATION
# CodeSwitch v10.2 - Business Context Enrichment
# ============================================================

# === THRESHOLDS ===
# Regulatory and business limits that replace "magic numbers"
thresholds:
  ctr: 10000                    # Currency Transaction Report (BSA requirement)
  sar: 5000                     # Suspicious Activity Report threshold
  daily_limit: 50000            # Daily transaction limit
  wire_minimum: 100             # Minimum wire transfer amount
  wire_maximum: 1000000         # Maximum wire transfer
  overdraft_limit: 500          # Default overdraft limit
  late_fee: 35                  # Late payment fee amount
  nsf_fee: 29                   # NSF (bounced check) fee
  interest_rate_max: 0.2499     # Maximum interest rate (24.99%)
  credit_score_min: 300         # Minimum credit score
  credit_score_max: 850         # Maximum credit score

# === ENUMS ===
# Code tables with descriptions - replaces string comparisons
enums:
  ach_return_code:
    R01: "Insufficient funds"
    R02: "Account closed"
    R03: "No account/unable to locate"
    R04: "Invalid account number"
    R05: "Unauthorized debit"
    R06: "Returned per ODFI request"
    R07: "Authorization revoked"
    R08: "Payment stopped"
    R09: "Uncollected funds"
    R10: "Customer advises not authorized"
    R11: "Check truncation entry return"
    R12: "Branch sold to another DFI"
    R13: "Invalid ACH routing number"
    R14: "Representative payee deceased"
    R15: "Beneficiary deceased"
    R16: "Account frozen"
    R17: "File record edit criteria"
    R20: "Non-transaction account"
    R21: "Invalid company identification"
    R22: "Invalid individual ID number"
    R23: "Credit entry refused by receiver"
    R24: "Duplicate entry"
    R29: "Corporate customer advises not authorized"
    R31: "Permissible return entry"
    R33: "Return of XCK entry"

  transaction_status:
    A: "Active"
    P: "Pending"
    C: "Completed"
    R: "Rejected"
    X: "Cancelled"
    H: "Hold"
    V: "Void"
    E: "Error"

  account_type:
    CHK: "Checking"
    SAV: "Savings"
    MMA: "Money Market"
    CD: "Certificate of Deposit"
    IRA: "Individual Retirement Account"
    LOC: "Line of Credit"
    MTG: "Mortgage"
    AUTO: "Auto Loan"
    PERS: "Personal Loan"
    CC: "Credit Card"

  wire_status:
    PEND: "Pending"
    APPR: "Approved"
    SENT: "Sent"
    RECV: "Received"
    FAIL: "Failed"
    CANC: "Cancelled"
    COMP: "Completed"

  compliance_flag:
    CTR: "Currency Transaction Report required"
    SAR: "Suspicious Activity Report filed"
    OFAC: "OFAC match - escalate immediately"
    PEP: "Politically Exposed Person"
    HIGH: "High-risk customer"
    WATCH: "Watchlist match"

# === FILE LAYOUTS ===
# Fixed-width record definitions (from copybooks)
file_layouts:
  ach:
    record_length: 94
    fields:
      - name: record_type
        pos: [1, 1]
        type: str
      - name: routing_number
        pos: [2, 10]
        type: str
      - name: account_number
        pos: [11, 27]
        type: str
      - name: amount
        pos: [28, 37]
        type: decimal
        precision: 2
      - name: transaction_code
        pos: [38, 39]
        type: str
      - name: company_name
        pos: [40, 55]
        type: str
      - name: discretionary_data
        pos: [56, 75]
        type: str
      - name: addenda_indicator
        pos: [76, 76]
        type: str
      - name: trace_number
        pos: [77, 94]
        type: str

  wire:
    record_length: 500
    fields:
      - name: message_type
        pos: [1, 4]
        type: str
      - name: sender_reference
        pos: [5, 20]
        type: str
      - name: beneficiary_account
        pos: [21, 54]
        type: str
      - name: amount
        pos: [55, 72]
        type: decimal
        precision: 2
      - name: currency
        pos: [73, 75]
        type: str
      - name: originator_name
        pos: [76, 140]
        type: str
      - name: beneficiary_name
        pos: [141, 205]
        type: str
      - name: beneficiary_bank_bic
        pos: [206, 216]
        type: str

# === SUBPROGRAMS ===
# COBOL CALL targets with Python implementations
subprograms:
  CALC-INTEREST:
    implementation: "return Decimal(args[0]) * Decimal(args[1]) / Decimal('36500') * Decimal(args[2])"
  CALC-PAYMENT:
    implementation: "principal, rate, months = args[:3]; r = Decimal(rate) / 12; return Decimal(principal) * r / (1 - (1 + r) ** -int(months))"
  DATE-DIFF:
    implementation: "from datetime import datetime; d1 = datetime.strptime(str(args[0]), '%Y%m%d'); d2 = datetime.strptime(str(args[1]), '%Y%m%d'); return (d2 - d1).days"
  FORMAT-AMOUNT:
    implementation: "return f'${Decimal(args[0]):,.2f}'"
  VALIDATE-ROUTING:
    implementation: "r = str(args[0]); return len(r) == 9 and r.isdigit() and sum(int(r[i]) * [3,7,1,3,7,1,3,7,1][i] for i in range(9)) % 10 == 0"
  LUHN-CHECK:
    implementation: "digits = [int(d) for d in str(args[0])]; return sum(digits[-1::-2]) + sum(sum(divmod(2*d, 10)) for d in digits[-2::-2]) % 10 == 0"

# === BUSINESS RULES ===
# Explicit business logic rules
business_rules:
  - id: CTR_THRESHOLD
    condition: "amount > 10000"
    action: "flag_ctr_required"
    description: "BSA Currency Transaction Report required for cash transactions over $10,000"
  
  - id: SAR_STRUCTURING
    condition: "daily_total > 8000 and daily_total < 10000 and transaction_count > 3"
    action: "flag_potential_structuring"
    description: "Potential structuring detected - multiple transactions just under CTR threshold"
  
  - id: OFAC_CHECK
    condition: "always"
    action: "check_ofac_list"
    description: "All transactions must be screened against OFAC SDN list"
  
  - id: HIGH_VALUE_WIRE
    condition: "wire_amount > 100000"
    action: "require_dual_approval"
    description: "Wire transfers over $100,000 require dual approval"
